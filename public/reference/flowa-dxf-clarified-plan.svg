<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">FLOWA DXF-derived gym reprogramming plan</title>
  <desc id="desc">A clarified architectural plan diagram of a long gym shell, with seven training zones and a continuous purple movement trajectory.</desc>
  <defs>
    <style>
      .ink{fill:none;stroke:#1c1c20;stroke-linecap:round;stroke-linejoin:round}.fine{fill:none;stroke:#63636b;stroke-width:1.2}.edge{fill:none;stroke:#19191e;stroke-width:4}.dim{fill:none;stroke:#807d88;stroke-width:1}.dash{fill:none;stroke:#7665ff;stroke-width:2;stroke-dasharray:8 8}.flow{fill:none;stroke:#7665ff;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.node{fill:#f6f4ff;stroke:#7665ff;stroke-width:4}.zone-label{font:700 13px Arial,sans-serif;letter-spacing:.08em;fill:#25242a}.small{font:500 10px Arial,sans-serif;letter-spacing:.12em;fill:#5a5861}.micro{font:500 9px Arial,sans-serif;letter-spacing:.08em;fill:#77747e}
    </style>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fffefb"/><stop offset="1" stop-color="#f4f2ef"/></linearGradient>
  </defs>
